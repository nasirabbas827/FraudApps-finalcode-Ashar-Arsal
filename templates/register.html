{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-success text-white text-center py-3">
                <h3 class="mb-0"><i class="bi bi-person-plus-fill me-2"></i> Join Our Community</h3>
            </div>
            <div class="card-body p-4 p-md-5">
                <h2 class="card-title text-center mb-4 fw-bold text-dark">Create Your Account</h2>
                
                <form method="post" action="{% url 'register' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                        <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="Choose a unique username" required>
                    </div>

                    <div class="mb-4">
                        <label for="email" class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="e.g., your@email.com" required>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="first_name" class="form-label fw-semibold">First Name</label>
                            <input type="text" class="form-control" id="first_name" name="first_name">
                        </div>
                        <div class="col-md-6">
                            <label for="last_name" class="form-label fw-semibold">Last Name</label>
                            <input type="text" class="form-control" id="last_name" name="last_name">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password" required>
                        <div class="form-text">Must be at least 8 characters long.</div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password_confirm" class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control form-control-lg" id="password_confirm" name="password_confirm" required>
                    </div>

                    <button type="submit" class="btn btn-success w-100 btn-lg mt-3 fw-bold">
                        <i class="bi bi-person-plus me-2"></i> Register Account
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted mb-0">
                        Already have an account? 
                        <a href="{% url 'login' %}" class="text-success fw-bold">Sign In Here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
